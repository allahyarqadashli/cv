<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin & Win</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 300px;
    height: 600px;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    background: #0f0c29;
  }

  #ad-container {
    width: 300px;
    height: 600px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, #1a0533 0%, #0d1b6e 50%, #0f0c29 100%);
  }

  /* Stars background */
  .stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle var(--d, 2s) ease-in-out infinite alternate;
    opacity: var(--o, 0.6);
  }
  @keyframes twinkle {
    from { opacity: 0.1; transform: scale(0.8); }
    to   { opacity: var(--o, 0.8); transform: scale(1.2); }
  }

  /* ── SPIN SCREEN ── */
  #spin-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
    transition: opacity .5s, transform .5s;
  }

  .top-banner {
    width: 100%;
    padding: 18px 0 10px;
    text-align: center;
  }
  .top-banner .eyebrow {
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: #c084fc;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .top-banner h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 36px;
    color: #fff;
    line-height: 1;
    text-shadow: 0 0 20px rgba(192,132,252,0.8), 0 2px 4px rgba(0,0,0,0.5);
  }
  .top-banner h1 span {
    color: #fcd34d;
    text-shadow: 0 0 20px rgba(252,211,77,0.9), 0 2px 4px rgba(0,0,0,0.5);
  }

  /* Wheel wrapper */
  .wheel-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    margin-top: 8px;
    flex-shrink: 0;
  }

  /* Glow ring */
  .wheel-wrap::before {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #a855f7, #6366f1, #ec4899, #f59e0b, #10b981, #a855f7);
    filter: blur(12px);
    opacity: 0.6;
    animation: rotateSlow 6s linear infinite;
  }
  @keyframes rotateSlow { to { transform: rotate(360deg); } }

  /* Outer ring */
  .wheel-outer {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      #7c3aed 0%, #7c3aed 12.5%,
      #1d4ed8 12.5%, #1d4ed8 25%,
      #be185d 25%, #be185d 37.5%,
      #b45309 37.5%, #b45309 50%,
      #15803d 50%, #15803d 62.5%,
      #0e7490 62.5%, #0e7490 75%,
      #7c3aed 75%, #7c3aed 87.5%,
      #1d4ed8 87.5%, #1d4ed8 100%
    );
    border: 4px solid rgba(255,255,255,0.15);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.05), inset 0 0 30px rgba(0,0,0,0.3);
  }

  canvas#wheel {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
  }

  /* Pointer */
  .pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 28px solid #fcd34d;
    filter: drop-shadow(0 2px 6px rgba(252,211,77,0.8));
    z-index: 10;
  }
  .pointer::after {
    content: '';
    position: absolute;
    top: -30px;
    left: -8px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fcd34d;
    box-shadow: 0 0 10px rgba(252,211,77,0.8);
  }

  /* Center hub */
  .hub {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 36px; height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff 0%, #e2e8f0 40%, #94a3b8 100%);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.3), 0 4px 12px rgba(0,0,0,0.5);
    z-index: 10;
  }

  /* Spin button */
  .spin-btn {
    margin-top: 22px;
    padding: 16px 50px;
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: #1a0533;
    background: linear-gradient(135deg, #fcd34d 0%, #f59e0b 50%, #fbbf24 100%);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(245,158,11,0.5), 0 2px 0 rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.4);
    position: relative;
    transition: transform .1s, box-shadow .1s;
    letter-spacing: 1px;
  }
  .spin-btn::before {
    content: '🎰';
    margin-right: 8px;
    font-size: 20px;
  }
  .spin-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(245,158,11,0.6), 0 2px 0 rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .spin-btn:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow: 0 3px 10px rgba(245,158,11,0.4), 0 1px 0 rgba(0,0,0,0.2);
  }
  .spin-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .subtext {
    margin-top: 12px;
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ── WIN SCREEN ── */
  #win-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 3;
    opacity: 0;
    pointer-events: none;
    transform: scale(1.08);
    transition: opacity .6s ease, transform .6s ease;
    background: linear-gradient(160deg, #1a0533 0%, #0d1b6e 50%, #0f0c29 100%);
  }
  #win-screen.visible {
    opacity: 1;
    pointer-events: all;
    transform: scale(1);
  }

  /* Confetti canvas */
  #confetti-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .win-content { position: relative; z-index: 1; text-align: center; padding: 0 20px; }

  .win-badge {
    font-family: 'Fredoka One', cursive;
    font-size: 13px;
    letter-spacing: 3px;
    color: #fcd34d;
    text-transform: uppercase;
    margin-bottom: 6px;
    opacity: 0;
    animation: fadeUp .5s .7s forwards;
  }

  .win-title {
    font-family: 'Fredoka One', cursive;
    font-size: 52px;
    line-height: 1;
    background: linear-gradient(135deg, #fcd34d, #f97316, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 20px rgba(252,211,77,0.5));
    opacity: 0;
    animation: bounceIn .6s .9s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  /* Gift box */
  .gift-wrap {
    position: relative;
    margin: 24px auto 0;
    width: 130px;
    height: 130px;
    opacity: 0;
    animation: bounceIn .7s 1.1s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  .gift-wrap::after {
    content: '';
    position: absolute;
    inset: -15px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(252,211,77,0.25) 0%, transparent 70%);
    animation: pulse 2s 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  .gift-box {
    width: 130px;
    height: 130px;
    position: relative;
  }

  /* SVG gift box drawn in CSS */
  .gift-svg { width: 130px; height: 130px; }

  .gift-shine {
    position: absolute;
    top: 8px; right: 16px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
    filter: blur(3px);
    animation: shine 1.5s 2s ease-in-out infinite alternate;
  }
  @keyframes shine { from { opacity: 0.3; } to { opacity: 0.9; } }

  .win-sub {
    margin-top: 16px;
    font-size: 13px;
    color: rgba(255,255,255,0.65);
    letter-spacing: 0.5px;
    opacity: 0;
    animation: fadeUp .5s 1.3s forwards;
  }

  .cta-btn {
    margin-top: 24px;
    padding: 18px 56px;
    font-family: 'Fredoka One', cursive;
    font-size: 24px;
    color: #fff;
    background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 50%, #4c1d95 100%);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(124,58,237,0.6), 0 2px 0 rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp .5s 1.6s forwards;
    transition: transform .15s, box-shadow .15s;
    letter-spacing: 1px;
  }
  .cta-btn::before {
    content: '';
    position: absolute;
    top: -50%; left: -60%;
    width: 40%; height: 200%;
    background: rgba(255,255,255,0.15);
    transform: skewX(-20deg);
    animation: shimmer 3s 2s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { left: -60%; }
    100% { left: 130%; }
  }
  .cta-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(124,58,237,0.7), 0 2px 0 rgba(0,0,0,0.3); }
  .cta-btn:active { transform: translateY(0); }

  .replay-btn {
    margin-top: 14px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: underline;
    opacity: 0;
    animation: fadeUp .5s 1.8s forwards;
    transition: color .2s;
  }
  .replay-btn:hover { color: rgba(255,255,255,0.7); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes bounceIn {
    from { opacity: 0; transform: scale(0.4); }
    to   { opacity: 1; transform: scale(1); }
  }

</style>
</head>
<body>
<div id="ad-container">

  <!-- Stars -->
  <div class="stars" id="stars"></div>

  <!-- ── SPIN SCREEN ── -->
  <div id="spin-screen">
    <div class="top-banner">
      <div class="eyebrow">Limited Time</div>
      <h1>SPIN &amp; <span>WIN</span></h1>
    </div>

    <div class="wheel-wrap" id="wheelWrap">
      <div class="pointer"></div>
      <div class="wheel-outer"></div>
      <canvas id="wheel" width="240" height="240"></canvas>
      <div class="hub"></div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="startSpin()">SPIN</button>
    <p class="subtext">Tap to try your luck!</p>
  </div>

  <!-- ── WIN SCREEN ── -->
  <div id="win-screen">
    <canvas id="confetti-canvas" width="300" height="600"></canvas>
    <div class="win-content">
      <div class="win-badge">🎉 Congratulations!</div>
      <div class="win-title">YOU WIN!</div>

      <div class="gift-wrap">
        <!-- SVG Gift Box -->
        <svg class="gift-svg" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
          <!-- Shadow -->
          <ellipse cx="65" cy="118" rx="42" ry="8" fill="rgba(0,0,0,0.25)"/>
          <!-- Box body -->
          <rect x="18" y="62" width="94" height="52" rx="4" fill="#dc2626"/>
          <rect x="18" y="62" width="94" height="52" rx="4" fill="url(#boxGrad)"/>
          <!-- Box lid -->
          <rect x="12" y="50" width="106" height="18" rx="4" fill="#b91c1c"/>
          <rect x="12" y="50" width="106" height="18" rx="4" fill="url(#lidGrad)"/>
          <!-- Ribbon vertical on body -->
          <rect x="58" y="62" width="14" height="52" fill="#fcd34d" opacity="0.9"/>
          <!-- Ribbon vertical on lid -->
          <rect x="58" y="50" width="14" height="18" fill="#fbbf24"/>
          <!-- Ribbon horizontal on body -->
          <rect x="18" y="82" width="94" height="12" fill="#fcd34d" opacity="0.9"/>
          <!-- Ribbon horizontal on lid -->
          <rect x="12" y="54" width="106" height="10" fill="#fbbf24"/>
          <!-- Bow left loop -->
          <ellipse cx="50" cy="44" rx="20" ry="10" fill="#fcd34d" transform="rotate(-30 50 44)"/>
          <!-- Bow right loop -->
          <ellipse cx="80" cy="44" rx="20" ry="10" fill="#f59e0b" transform="rotate(30 80 44)"/>
          <!-- Bow center -->
          <circle cx="65" cy="48" r="10" fill="#fbbf24"/>
          <circle cx="65" cy="48" r="6" fill="#fcd34d"/>
          <!-- Shine on lid -->
          <rect x="20" y="53" width="30" height="4" rx="2" fill="rgba(255,255,255,0.25)"/>
          <!-- Shine on body -->
          <rect x="20" y="65" width="20" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
          <!-- Stars decoration -->
          <text x="30" y="98" font-size="14" fill="rgba(255,255,255,0.5)">✦</text>
          <text x="88" y="88" font-size="10" fill="rgba(255,255,255,0.4)">✦</text>
          <defs>
            <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
              <stop offset="100%" stop-color="rgba(0,0,0,0.1)"/>
            </linearGradient>
            <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
              <stop offset="100%" stop-color="rgba(0,0,0,0.05)"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="gift-shine"></div>
      </div>

      <p class="win-sub">Your exclusive reward is waiting</p>
      <button class="cta-btn" onclick="handleCTA()">SHOP NOW</button>
      <button class="replay-btn" onclick="replay()">Play again</button>
    </div>
  </div>

</div>

<script>
// ── Stars ──
(function(){
  const c = document.getElementById('stars');
  for(let i=0;i<55;i++){
    const s = document.createElement('div');
    s.className='star';
    const size = Math.random()*2.5+0.5;
    s.style.cssText=`width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${(Math.random()*3+1).toFixed(1)}s;--o:${(Math.random()*0.6+0.3).toFixed(2)};animation-delay:${(Math.random()*3).toFixed(1)}s`;
    c.appendChild(s);
  }
})();

// ── Wheel ──
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const W = 240, R = W/2, CX = R, CY = R;

// 8 segments — replace image paths with your own
const segments = [
  { label: 'IMG 1', color: '#7c3aed', textColor: '#fff', img: null },
  { label: 'IMG 2', color: '#1d4ed8', textColor: '#fff', img: null },
  { label: 'IMG 3', color: '#be185d', textColor: '#fff', img: null },
  { label: 'IMG 4', color: '#b45309', textColor: '#fff', img: null },
  { label: 'IMG 5', color: '#15803d', textColor: '#fff', img: null },
  { label: 'IMG 6', color: '#0e7490', textColor: '#fff', img: null },
  { label: 'IMG 7', color: '#7c3aed', textColor: '#fff', img: null },
  { label: 'IMG 8', color: '#1d4ed8', textColor: '#fff', img: null },
];

const SEG_COUNT = segments.length;
const ARC = (Math.PI * 2) / SEG_COUNT;
let currentAngle = 0;
let spinning = false;

function drawWheel(angle) {
  ctx.clearRect(0, 0, W, W);
  for (let i = 0; i < SEG_COUNT; i++) {
    const start = angle + i * ARC;
    const end = start + ARC;
    const seg = segments[i];

    // Segment fill
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R - 4, start, end);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();

    // Segment inner shine
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R - 4, start, end);
    ctx.closePath();
    const grad = ctx.createRadialGradient(CX, CY, 10, CX, CY, R);
    grad.addColorStop(0, 'rgba(255,255,255,0.18)');
    grad.addColorStop(1, 'rgba(0,0,0,0.12)');
    ctx.fillStyle = grad;
    ctx.fill();

    // Divider lines
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(CX + (R-4) * Math.cos(start), CY + (R-4) * Math.sin(start));
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Draw image or label
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(start + ARC / 2);
    ctx.translate(R * 0.58, 0);

    if (seg.img && seg.img.complete && seg.img.naturalWidth > 0) {
      // Draw image centered in segment
      const imgSize = 34;
      ctx.save();
      ctx.rotate(Math.PI / 2);
      // Clip to circle
      ctx.beginPath();
      ctx.arc(0, 0, imgSize/2 + 2, 0, Math.PI*2);
      ctx.clip();
      ctx.drawImage(seg.img, -imgSize/2, -imgSize/2, imgSize, imgSize);
      ctx.restore();
    } else {
      // Placeholder text
      ctx.rotate(Math.PI / 2);
      ctx.fillStyle = seg.textColor;
      ctx.font = 'bold 10px Nunito, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Placeholder image icon
      ctx.font = '18px serif';
      ctx.fillText('🖼️', 0, 0);
    }
    ctx.restore();
  }

  // Outer ring
  ctx.beginPath();
  ctx.arc(CX, CY, R - 3, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 3;
  ctx.stroke();
}

drawWheel(currentAngle);

// ── Spin logic ──
let spinVelocity = 0;
let animId = null;
const spinBtn = document.getElementById('spinBtn');

function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

function startSpin() {
  if (spinning) return;
  spinning = true;
  spinBtn.disabled = true;

  const totalRotation = (Math.PI * 2 * (8 + Math.random() * 8)); // 8-16 full spins
  const duration = 4000 + Math.random() * 2000;
  const startTime = performance.now();
  const startAngle = currentAngle;

  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = easeOut(progress);
    currentAngle = startAngle + totalRotation * eased;
    drawWheel(currentAngle);

    if (progress < 1) {
      animId = requestAnimationFrame(animate);
    } else {
      currentAngle = startAngle + totalRotation;
      drawWheel(currentAngle);
      spinning = false;
      setTimeout(showWin, 600);
    }
  }
  animId = requestAnimationFrame(animate);
}

// ── Win Screen ──
function showWin() {
  const win = document.getElementById('win-screen');
  win.classList.add('visible');
  startConfetti();
}

function handleCTA() {
  // Replace with your actual click-through URL
  window.open('https://yourstore.com', '_blank');
}

function replay() {
  const win = document.getElementById('win-screen');
  win.classList.remove('visible');
  // Reset animations by re-cloning win content
  win.querySelectorAll('[style*="animation"], .win-badge, .win-title, .gift-wrap, .win-sub, .cta-btn, .replay-btn').forEach(el => {
    el.style.animation = 'none';
    el.offsetHeight; // reflow
    el.style.animation = '';
  });
  stopConfetti();
  spinBtn.disabled = false;
  spinning = false;
}

// ── Confetti ──
const confCanvas = document.getElementById('confetti-canvas');
const cc = confCanvas.getContext('2d');
let confettiParticles = [];
let confettiRunning = false;
let confettiId = null;

const confColors = ['#fcd34d','#f97316','#ec4899','#a855f7','#6366f1','#10b981','#fff'];

function startConfetti() {
  confettiParticles = [];
  confettiRunning = true;
  for (let i = 0; i < 120; i++) {
    confettiParticles.push({
      x: Math.random() * 300,
      y: Math.random() * -200 - 10,
      w: Math.random() * 8 + 4,
      h: Math.random() * 5 + 3,
      color: confColors[Math.floor(Math.random() * confColors.length)],
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 4 + 2,
      angle: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.2,
      opacity: 1,
    });
  }
  animateConfetti();
}

function stopConfetti() {
  confettiRunning = false;
  if (confettiId) cancelAnimationFrame(confettiId);
  cc.clearRect(0, 0, 300, 600);
}

function animateConfetti() {
  cc.clearRect(0, 0, 300, 600);
  confettiParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.06; // gravity
    p.angle += p.spin;
    if (p.y > 500) p.opacity -= 0.02;

    cc.save();
    cc.translate(p.x, p.y);
    cc.rotate(p.angle);
    cc.globalAlpha = Math.max(0, p.opacity);
    cc.fillStyle = p.color;
    cc.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    cc.restore();
  });

  confettiParticles = confettiParticles.filter(p => p.opacity > 0 && p.y < 650);

  // Respawn to keep going
  if (confettiRunning && confettiParticles.length < 80) {
    for (let i = 0; i < 10; i++) {
      confettiParticles.push({
        x: Math.random() * 300,
        y: -10,
        w: Math.random() * 8 + 4,
        h: Math.random() * 5 + 3,
        color: confColors[Math.floor(Math.random() * confColors.length)],
        vx: (Math.random() - 0.5) * 3,
        vy: Math.random() * 3 + 1,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.2,
        opacity: 1,
      });
    }
  }

  if (confettiRunning || confettiParticles.length > 0) {
    confettiId = requestAnimationFrame(animateConfetti);
  }
}

// ── Image loading helper ──
// To add images: call loadSegmentImage(index, 'path/to/image.png')
// e.g. loadSegmentImage(0, 'prize1.png')
window.loadSegmentImage = function(index, src) {
  if (index < 0 || index >= SEG_COUNT) return;
  const img = new Image();
  img.onload = () => {
    segments[index].img = img;
    drawWheel(currentAngle);
  };
  img.src = src;
};

</script>
