<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Ninja Slice – Playable Banner Ad</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #111;
    font-family: sans-serif;
  }
  #banner-wrapper {
    position: relative;
    width: 300px;
    height: 600px;
    overflow: hidden;
    cursor: crosshair;
    border-radius: 4px;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
  }
  #bg-layer {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  #bg-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.6) 100%);
  }
  canvas {
    position: absolute; inset: 0;
    display: block;
  }

  /* HUD */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px 10px;
    pointer-events: none;
    z-index: 10;
  }
  #score-display {
    font-family: 'Courier New', monospace;
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,220,50,0.8), 0 2px 4px rgba(0,0,0,0.9);
    letter-spacing: 2px;
  }
  #timer-display {
    font-family: 'Courier New', monospace;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,100,100,0.7), 0 2px 4px rgba(0,0,0,0.9);

  #score-label, #timer-label {

  /* Combo pop */

  #start-screen {

  /* CTA / End screen */
  #cta-screen {

  #cta-screen.visible { display: flex; }
  #cta-screen .slash-deco {

  #cta-headline {
    font-family: 'Courier New', monospace;

  #cta-score-block {

  #cta-score-label {

  #cta-btn {
    display: inline-block;
    background: linear-gradient(135deg, #ffe030, #ff8c00);

    padding: 15px 40px;

  .play-again-btn {
    margin-top: 14px;

  .play-again-btn:hover { color: #fff; border-color: rgba(255,255,255,0.5); }

  /* Bomb warning */
  #bomb-warn {

    pointer-events: none;

    opacity: 0;
    transition: opacity 0.3s;
    text-transform: uppercase;

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }

  @keyframes pulse {
    0%,100% { box-shadow: 0 4px 24px rgba(255,180,0,0.5); }
    50% { box-shadow: 0 4px 40px rgba(255,180,0,0.9); }
  }
</style>

<script>
/* ═══════════════════════════════════════════════════════════════
   ██████╗ ██████╗ ███╗   ██╗███████╗██╗ ██████╗
  ██╔════╝██╔═══██╗████╗  ██║██╔════╝██║██╔════╝
  ██║     ██║   ██║██╔██╗ ██║█████╗  ██║██║  ███╗
  ██║     ██║   ██║██║╚██╗██║██╔══╝  ██║██║   ██║
  ╚██████╗╚██████╔╝██║ ╚████║██║     ██║╚██████╔╝
   ╚═════╝ ╚═════╝ ╚═╝  ╚═══╝╚═╝     ╚═╝ ╚═════╝
   Designers: edit ONLY this section.
═══════════════════════════════════════════════════════════════ */
const CONFIG = {

  /* ── Background ── */
  background: '/assets/background.jpg',  // replace with your image path

  /* ── Sliceable objects ──
     Each entry: { src, sliceLeft, sliceRight, points }
     Add or remove objects freely. */
  objects: [
    {
      src:        '/assets/object1.png',
      sliceLeft:  '/assets/object1_slice_left.png',
      sliceRight: '/assets/object1_slice_right.png',
      points: 10
    },
    {
      src:        '/assets/object2.png',
      sliceLeft:  '/assets/object2_slice_left.png',
      sliceRight: '/assets/object2_slice_right.png',
      points: 15
    },
    {
      src:        '/assets/object3.png',
      sliceLeft:  '/assets/object3_slice_left.png',
      sliceRight: '/assets/object3_slice_right.png',
      points: 20
    },
  ],

  /* ── Bomb ── */
  bomb: {
    src: '/assets/bomb.png',
    scorePenalty: 30     // score deducted when sliced
  },

  /* ── Visual style ── */
  trailColor:    'rgba(255, 220, 50, 0.85)',  // swipe trail
  particleColor: '#FFE030',                   // slice burst particles
  sliceLineColor:'rgba(255,255,255,0.9)',      // flash line on cut

  /* ── Gameplay ── */
  gameDuration: 30,       // seconds
  spawnInterval: 900,     // ms between spawns (lower = faster)
  bombChance: 0.18,       // 0–1 probability of bomb per spawn
  objectSize: 68,         // px (diameter)

  /* ── End screen copy ── */
  ctaHeadline:   'TEBRIKLER QAZANDIN',
  ctaButtonText: 'INDI AL',
  ctaButtonLink: 'https://smartbee.az',
};
/* ═══════════════════════════════════════════════════════ END CONFIG ═ */




/* ───────────────────────────────────────────────────────────
   ASSET LOADING
─────────────────────────────────────────────────────────── */
const imageCache = {};

function loadImage(src) {
  if (imageCache[src]) return imageCache[src];
  const img = new Image();
  img.src = src;
  img.onerror = () => { img._failed = true; };
  imageCache[src] = img;
  return img;
}

// Preload all configured assets
function preloadAssets() {
  loadImage(CONFIG.background);
  loadImage(CONFIG.bomb.src);
  CONFIG.objects.forEach(o => {
    loadImage(o.src);
    loadImage(o.sliceLeft);
    loadImage(o.sliceRight);
  });
}

// Apply background to bg-layer div
function applyBackground() {
  const bgLayer = document.getElementById('bg-layer');
  const img = loadImage(CONFIG.background);
  const setUrl = () => { bgLayer.style.backgroundImage = `url('${CONFIG.background}')`; };
  if (img.complete && !img._failed) setUrl();
  else img.onload = setUrl;
  // fallback gradient if image fails
  img.onerror = () => {
    bgLayer.style.background = 'linear-gradient(160deg, #0a0a1a 0%, #1a0a2e 40%, #0d1a0a 100%)';
  };
}




/* ───────────────────────────────────────────────────────────
   GAME LOGIC
─────────────────────────────────────────────────────────── */
const canvas   = document.getElementById('game-canvas');
const ctx      = canvas.getContext('2d');
const W = 300, H = 600;

/* ── State ── */
let score       = 0;
let timeLeft    = CONFIG.gameDuration;
let gameRunning = false;
let spawnTimer  = null;
let countTimer  = null;
let objects     = [];   // active flying objects
let pieces      = [];   // sliced halves
let particles   = [];   // burst particles
let trail       = [];   // swipe trail points
let animFrame   = null;

/* ── Trail ── */
const TRAIL_MAX = 22;
let isPointerDown = false;
let lastX = 0, lastY = 0;

/* ── Combo ── */
let combo = 0;
let comboTimeout = null;

/* ────── Spawn ────── */
function spawnObject() {
  if (!gameRunning) return;
  const isBomb = Math.random() < CONFIG.bombChance;
  const x = 30 + Math.random() * (W - 60);
  // Launch strong enough to arc through center (y=300) and above.
  // With GRAVITY=0.13, peak height = vy²/(2*g). Need peak near y=150–250.
  // vy needed: sqrt(2 * 0.13 * 350) ≈ 9.5  →  use 9–14 range.
  const speedY = -(9.5 + Math.random() * 4.5);  // upward
  const speedX = (Math.random() - 0.5) * 2.8;
  const rotSpeed = (Math.random() - 0.5) * 0.12;
  const size = CONFIG.objectSize;
  const objDef = isBomb ? null : CONFIG.objects[Math.floor(Math.random() * CONFIG.objects.length)];

  objects.push({
    x, y: H - 10,
    vx: speedX, vy: speedY,
    rot: Math.random() * Math.PI * 2,
    rotSpeed,
    size, isBomb,
    objDef,
    img: isBomb ? loadImage(CONFIG.bomb.src) : loadImage(objDef.src),
    sliced: false,
    opacity: 1,
    id: Math.random()
  });
}

/* ────── Slice detection ────── */
function checkSlice(x1, y1, x2, y2) {
  if (!isPointerDown) return;
  for (let i = objects.length - 1; i >= 0; i--) {
    const o = objects[i];
    if (o.sliced) continue;
    const r = o.size * 0.5;
    // check if segment crosses bounding circle
    if (segmentCircle(x1, y1, x2, y2, o.x, o.y, r)) {
      o.sliced = true;
      if (o.isBomb) {
        handleBombSlice(o);
      } else {
        handleSlice(o);
      }
    }
  }
}

function segmentCircle(ax, ay, bx, by, cx, cy, r) {
  const dx = bx - ax, dy = by - ay;
  const fx = ax - cx, fy = ay - cy;
  const a = dx*dx + dy*dy;
  const b = 2*(fx*dx + fy*dy);
  const c = fx*fx + fy*fy - r*r;
  let disc = b*b - 4*a*c;
  if (disc < 0) return false;
  disc = Math.sqrt(disc);
  const t1 = (-b - disc) / (2*a);
  const t2 = (-b + disc) / (2*a);
  return (t1 >= 0 && t1 <= 1) || (t2 >= 0 && t2 <= 1);
}

function handleSlice(o) {
  // Score
  combo++;
  clearTimeout(comboTimeout);
  comboTimeout = setTimeout(() => { combo = 0; }, 900);

  const pts = o.objDef.points * (combo > 2 ? 2 : combo > 1 ? 1.5 : 1);
  score += Math.round(pts);
  updateHUD();
  showComboPop(combo > 1 ? `×${combo} COMBO!` : `+${o.objDef.points}`);

  // Slice flash line
  spawnSliceLine(o.x, o.y);

  // Particles
  spawnParticles(o.x, o.y, 14);

  // Sliced halves
  const leftImg  = loadImage(o.objDef.sliceLeft);
  const rightImg = loadImage(o.objDef.sliceRight);
  const halfW = o.size;
  const halfH = o.size * 0.6;
  pieces.push(
    { x: o.x - 10, y: o.y, vx: -2 - Math.random(), vy: o.vy * 0.7,
      rot: o.rot, rotSpeed: -0.09, img: leftImg, w: halfW, h: halfH, opacity: 1, gravity: 0.2 },
    { x: o.x + 10, y: o.y, vx: 2 + Math.random(),  vy: o.vy * 0.7,
      rot: o.rot, rotSpeed: 0.09,  img: rightImg, w: halfW, h: halfH, opacity: 1, gravity: 0.2 }
  );
}

function handleBombSlice(o) {
  score = Math.max(0, score - CONFIG.bomb.scorePenalty);
  combo = 0;
  updateHUD();
  showComboPop(`-${CONFIG.bomb.scorePenalty} BOMB!`, '#ff4444');
  spawnParticles(o.x, o.y, 20, '#ff4400');
  flashBombWarn();
  // shockwave ring
  spawnShockwave(o.x, o.y);
}

/* ────── Particles ────── */
let sliceLines = [];
let shockwaves = [];

function spawnParticles(x, y, count, color) {
  const c = color || CONFIG.particleColor;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1, decay: 0.04 + Math.random() * 0.03,
      size: 2 + Math.random() * 4,
      color: c
    });
  }
}

function spawnSliceLine(x, y) {
  sliceLines.push({ x, y, life: 1, angle: Math.random() * Math.PI });
}

function spawnShockwave(x, y) {
  shockwaves.push({ x, y, r: 10, life: 1 });
}

/* ────── Update ────── */
function update() {
  const GRAVITY = 0.13;

  // Objects
  for (let i = objects.length - 1; i >= 0; i--) {
    const o = objects[i];
    o.vy += GRAVITY;
    o.x += o.vx; o.y += o.vy;
    o.rot += o.rotSpeed;
    if (o.sliced) o.opacity -= 0.08;
    if (o.y > H + 100 || o.opacity <= 0) objects.splice(i, 1);
  }

  // Pieces
  for (let i = pieces.length - 1; i >= 0; i--) {
    const p = pieces[i];
    p.vy += p.gravity;
    p.x += p.vx; p.y += p.vy;
    p.rot += p.rotSpeed;
    p.opacity -= 0.014;
    if (p.y > H + 100 || p.opacity <= 0) pieces.splice(i, 1);
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.12;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Slice lines
  for (let i = sliceLines.length - 1; i >= 0; i--) {
    sliceLines[i].life -= 0.1;
    if (sliceLines[i].life <= 0) sliceLines.splice(i, 1);
  }

  // Shockwaves
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    shockwaves[i].r += 5;
    shockwaves[i].life -= 0.06;
    if (shockwaves[i].life <= 0) shockwaves.splice(i, 1);
  }

  // Trail decay
  for (let i = trail.length - 1; i >= 0; i--) {
    trail[i].life -= 0.055;
    if (trail[i].life <= 0) trail.splice(i, 1);
  }
}

/* ────── Draw ────── */
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Draw sliced pieces
  pieces.forEach(p => drawImageRotated(ctx, p.img, p.x, p.y, p.w, p.h, p.rot, p.opacity));

  // Draw objects
  objects.forEach(o => drawImageRotated(ctx, o.img, o.x, o.y, o.size, o.size, o.rot, o.opacity));

  // Slice flash lines
  sliceLines.forEach(sl => {
    ctx.save();
    ctx.globalAlpha = sl.life * 0.8;
    ctx.strokeStyle = CONFIG.sliceLineColor;
    ctx.lineWidth = 3;
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    const len = 36;
    ctx.moveTo(sl.x - Math.cos(sl.angle)*len, sl.y - Math.sin(sl.angle)*len);
    ctx.lineTo(sl.x + Math.cos(sl.angle)*len, sl.y + Math.sin(sl.angle)*len);
    ctx.stroke();
    ctx.restore();
  });

  // Shockwaves
  shockwaves.forEach(sw => {
    ctx.save();
    ctx.globalAlpha = sw.life * 0.6;
    ctx.strokeStyle = '#ff6600';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#ff4400';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });

  // Particles
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // Swipe trail
  if (trail.length > 1) {
    ctx.save();
    for (let i = 1; i < trail.length; i++) {
      const t0 = trail[i-1], t1 = trail[i];
      const alpha = Math.min(t0.life, t1.life) * 0.85;
      const lw = (i / trail.length) * 10 * Math.min(t0.life, t1.life);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = CONFIG.trailColor;
      ctx.lineWidth = lw;
      ctx.lineCap = 'round';
      ctx.shadowColor = CONFIG.trailColor;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(t0.x, t0.y);
      ctx.lineTo(t1.x, t1.y);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawImageRotated(ctx, img, x, y, w, h, rot, opacity) {
  ctx.save();
  ctx.globalAlpha = Math.max(0, opacity);
  ctx.translate(x, y);
  ctx.rotate(rot);
  if (img && img.complete && !img._failed) {
    ctx.drawImage(img, -w/2, -h/2, w, h);
  } else {
    // Fallback: colored circle with emoji
    ctx.beginPath();
    ctx.arc(0, 0, w/2, 0, Math.PI*2);
    ctx.fillStyle = img._isBomb ? '#333' : getRandomFruitColor(img.src);
    ctx.fill();
    ctx.font = `${w * 0.55}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(getFallbackEmoji(img), 0, 2);
  }
  ctx.restore();
}

// Fallback visuals when images are not found
const fruitColors = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6','#1abc9c'];
function getRandomFruitColor(src) {
  let hash = 0;
  for (let i = 0; i < src.length; i++) hash = src.charCodeAt(i) + ((hash << 5) - hash);
  return fruitColors[Math.abs(hash) % fruitColors.length];
}
const fruitEmojis = ['🍉','🍊','🍋','🍎','🍇','🥥','🍑','🍓','🥭'];
function getFallbackEmoji(img) {
  if (img.src && img.src.includes('bomb')) return '💣';
  let hash = 0;
  const s = img.src || '';
  for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
  return fruitEmojis[Math.abs(hash) % fruitEmojis.length];
}

/* ────── Loop ────── */
function loop() {
  update();
  draw();
  if (gameRunning) animFrame = requestAnimationFrame(loop);
}

/* ────── HUD updates ────── */
function updateHUD() {
  document.getElementById('score-display').textContent = score;
}

function showComboPop(text, color) {
  const el = document.getElementById('combo-pop');
  el.textContent = text;
  el.style.color = color || '#ffe030';
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 700);
}

function flashBombWarn() {
  const el = document.getElementById('bomb-warn');
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 1200);
}

/* ────── Timer ────── */
function startCountdown() {
  timeLeft = CONFIG.gameDuration;
  document.getElementById('timer-display').textContent = timeLeft;
  countTimer = setInterval(() => {
    timeLeft--;
    const timerEl = document.getElementById('timer-display');
    timerEl.textContent = timeLeft;
    if (timeLeft <= 3) {
      timerEl.style.color = '#ff4444';
      timerEl.style.transform = 'scale(1.3)';
      setTimeout(() => { timerEl.style.transform = 'scale(1)'; }, 150);
    }
    if (timeLeft <= 0) endGame();
  }, 1000);
}

/* ────── Start / End ────── */
function startGame() {
  score = 0; combo = 0;
  objects = []; pieces = []; particles = []; trail = [];
  sliceLines = []; shockwaves = [];
  updateHUD();
  document.getElementById('timer-display').style.color = '#fff';
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('cta-screen').classList.remove('visible');
  gameRunning = true;

  spawnTimer = setInterval(spawnObject, CONFIG.spawnInterval);
  startCountdown();
  loop();
}

function endGame() {
  gameRunning = false;
  clearInterval(spawnTimer);
  clearInterval(countTimer);
  cancelAnimationFrame(animFrame);
  // Final draw
  draw();
  showCTAScreen();
}

function showCTAScreen() {
  document.getElementById('cta-headline').textContent = CONFIG.ctaHeadline;
  document.getElementById('cta-score-value').textContent = score;
  const btn = document.getElementById('cta-btn');
  btn.textContent = CONFIG.ctaButtonText;
  btn.href = CONFIG.ctaButtonLink;
  document.getElementById('cta-screen').classList.add('visible');
}

   UI / CTA / INTERACTION
─────────────────────────────────────────────────────────── */

/* ── Pointer events (mouse + touch) ── */
const wrapper = document.getElementById('banner-wrapper');

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  if (e.touches) {
    return {
      x: (e.touches[0].clientX - rect.left) * scaleX,
      y: (e.touches[0].clientY - rect.top)  * scaleY
    };
  }
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top)  * scaleY
  };
}

function onPointerDown(e) {
  if (!gameRunning) return;
  e.preventDefault();
  isPointerDown = true;
  const pos = getPos(e);
  lastX = pos.x; lastY = pos.y;
  trail = [{ x: pos.x, y: pos.y, life: 1 }];
}

function onPointerMove(e) {
  if (!gameRunning || !isPointerDown) return;
  e.preventDefault();
  const pos = getPos(e);
  checkSlice(lastX, lastY, pos.x, pos.y);
  trail.push({ x: pos.x, y: pos.y, life: 1 });
  if (trail.length > TRAIL_MAX) trail.shift();
  lastX = pos.x; lastY = pos.y;
}

function onPointerUp(e) {
  isPointerDown = false;
}

canvas.addEventListener('mousedown',  onPointerDown, { passive: false });
canvas.addEventListener('mousemove',  onPointerMove, { passive: false });
canvas.addEventListener('mouseup',    onPointerUp);
canvas.addEventListener('mouseleave', onPointerUp);

canvas.addEventListener('touchstart', onPointerDown, { passive: false });
canvas.addEventListener('touchmove',  onPointerMove, { passive: false });
canvas.addEventListener('touchend',   onPointerUp,   { passive: false });

/* ── Buttons ── */
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('play-again-btn').addEventListener('click', () => {
  document.getElementById('cta-screen').classList.remove('visible');
  document.getElementById('start-screen').style.display = 'flex';
});

/* ── Init ── */
preloadAssets();
applyBackground();

// Draw static canvas background tint on load
ctx.clearRect(0, 0, W, H);
